<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Primavista">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- sheet of music: staff lines -->
  <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round">
    <line x1="30" y1="44" x2="98" y2="44"/>
    <line x1="30" y1="56" x2="98" y2="56"/>
    <line x1="30" y1="68" x2="98" y2="68"/>
    <line x1="30" y1="80" x2="98" y2="80"/>
  </g>
  <!-- a note whose stem is a text caret: sight-read, then write -->
  <g fill="#ffffff">
    <ellipse cx="52" cy="82" rx="13" ry="9.5" transform="rotate(-20 52 82)"/>
    <rect x="61" y="34" width="5" height="48" rx="2.5"/>
    <rect x="55" y="30" width="17" height="5" rx="2.5"/>
    <rect x="55" y="30" width="5" height="5" rx="2.5" opacity="0"/>
  </g>
  <!-- flag as a cursor blink -->
  <path d="M66 36 C 84 42, 90 54, 82 68 C 86 56, 78 48, 66 46 Z" fill="#ffffff"/>
</svg>
