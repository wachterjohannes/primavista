name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:versions
      - run: pnpm build
      - run: pnpm size
      - run: pnpm typecheck
      - run: pnpm test
      - name: Packed packages work in an empty project
        run: pnpm verify:packages
      - name: Built controller is committed
        run: git diff --exit-code -- bundles/ux-bundle/assets/dist

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - run: composer install --no-interaction --working-dir=libs/html-sanitizer
      - run: composer test --working-dir=libs/html-sanitizer
      - run: composer phpstan --working-dir=libs/html-sanitizer
      - run: composer install --no-interaction --working-dir=bundles/ux-bundle
      - run: composer test --working-dir=bundles/ux-bundle
      - run: composer phpstan --working-dir=bundles/ux-bundle
      - run: composer install --no-interaction --working-dir=bundles/sulu-bundle
      - run: composer test --working-dir=bundles/sulu-bundle
      - run: composer phpstan --working-dir=bundles/sulu-bundle

  e2e:
    runs-on: ubuntu-latest
    needs: [javascript, php]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: composer install --no-interaction --working-dir=demo
      - run: pnpm exec playwright install --with-deps chromium firefox
      - run: pnpm e2e
        env:
          CI: '1'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results

  sulu:
    runs-on: ubuntu-latest
    needs: [javascript, php]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sulu
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    # 3.1 is an alpha: it shows breakage early and does not block the merge.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        sulu: ['3.0.*']
        experimental: [false]
        include:
          - sulu: 3.1.x-dev
            experimental: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, gd, pdo_mysql, zip, xml, mbstring, curl
          tools: composer
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Sulu project with Primavista as the text editor
        run: e2e-sulu/setup.sh
        env:
          SULU_VERSION: ${{ matrix.sulu }}
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/sulu?serverVersion=8.4&charset=utf8mb4
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e:sulu
        env:
          CI: '1'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: sulu-${{ strategy.job-index }}-report
          path: test-results
