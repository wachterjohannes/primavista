name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Built controller is committed
        run: git diff --exit-code -- bundles/ux-bundle/assets/dist

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - run: composer install --no-interaction --working-dir=bundles/ux-bundle
      - run: composer test --working-dir=bundles/ux-bundle
      - run: composer phpstan --working-dir=bundles/ux-bundle
      - run: composer install --no-interaction --working-dir=bundles/sulu-bundle
      - run: composer test --working-dir=bundles/sulu-bundle
      - run: composer phpstan --working-dir=bundles/sulu-bundle

  e2e:
    runs-on: ubuntu-latest
    needs: [javascript, php]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: composer install --no-interaction --working-dir=demo
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          CI: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
